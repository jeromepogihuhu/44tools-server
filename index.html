<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>44Tools — BotFlood Panel</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet"/>
  <style>
    :root {
      --bg:      #0e0e0f;
      --bg-2:    #141416;
      --bg-3:    #1a1a1d;
      --bg-4:    #222226;
      --border:  rgba(255,255,255,0.07);
      --bmd:     rgba(255,255,255,0.12);
      --t1:      #f0f0f2;
      --t2:      #9999a8;
      --t3:      #55555f;
      --green:   #4ade80;
      --red:     #f87171;
      --yellow:  #fbbf24;
      --font:    'Inter', sans-serif;
      --mono:    'JetBrains Mono', monospace;
      --r:       10px;
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { -webkit-text-size-adjust: 100%; }
    body { background: var(--bg); color: var(--t1); font-family: var(--font); font-size: 14px; line-height: 1.6; -webkit-font-smoothing: antialiased; min-height: 100vh; }
    ::-webkit-scrollbar { width: 4px; } ::-webkit-scrollbar-thumb { background: var(--bg-4); border-radius: 4px; }

    /* NAV */
    .nav { height: 54px; border-bottom: 1px solid var(--border); display: flex; align-items: center; padding: 0 24px; background: var(--bg-2); }
    .nav-brand { font-family: var(--mono); font-size: 18px; font-weight: 700; color: var(--t1); letter-spacing: -0.03em; }
    .nav-brand span { color: var(--t3); font-weight: 400; }
    .nav-right { margin-left: auto; display: flex; align-items: center; gap: 10px; }
    .conn-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--t3); transition: background 0.3s; }
    .conn-dot.on { background: var(--green); box-shadow: 0 0 6px var(--green); }
    .conn-label { font-size: 11px; color: var(--t3); font-family: var(--mono); }

    /* LAYOUT */
    .wrap { max-width: 960px; margin: 0 auto; padding: 32px 20px; display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
    @media(max-width: 680px) { .wrap { grid-template-columns: 1fr; } }

    /* CARDS */
    .card { background: var(--bg-2); border: 1px solid var(--border); border-radius: var(--r); padding: 22px; }
    .card-title { font-size: 13px; font-weight: 600; color: var(--t1); letter-spacing: -0.01em; margin-bottom: 18px; display: flex; align-items: center; gap: 8px; }
    .card-title svg { width: 15px; height: 15px; color: var(--t3); }

    /* STATUS BAR */
    .status-bar { grid-column: 1 / -1; display: flex; align-items: center; gap: 20px; background: var(--bg-2); border: 1px solid var(--border); border-radius: var(--r); padding: 16px 22px; }
    .status-item { display: flex; flex-direction: column; }
    .status-label { font-size: 10px; font-weight: 600; letter-spacing: 0.1em; color: var(--t3); margin-bottom: 2px; }
    .status-val { font-size: 18px; font-weight: 700; color: var(--t1); font-family: var(--mono); letter-spacing: -0.02em; }
    .status-sep { width: 1px; height: 32px; background: var(--border); }
    .status-badge { margin-left: auto; display: flex; align-items: center; gap: 7px; font-family: var(--mono); font-size: 11px; color: var(--t3); background: var(--bg-4); border-radius: 20px; padding: 5px 14px; border: 1px solid var(--border); }
    .status-badge.active { color: var(--green); border-color: rgba(74,222,128,0.2); background: rgba(74,222,128,0.07); }
    .badge-dot { width: 6px; height: 6px; border-radius: 50%; background: currentColor; }

    /* FORM */
    .fg { display: flex; flex-direction: column; gap: 5px; margin-bottom: 14px; }
    .fg label { font-size: 11px; font-weight: 500; color: var(--t2); letter-spacing: 0.03em; }
    .fg input, .fg textarea { background: var(--bg-3); border: 1px solid var(--border); border-radius: 7px; color: var(--t1); font-size: 13px; padding: 10px 12px; outline: none; transition: border-color 0.15s; width: 100%; font-family: var(--font); }
    .fg input:focus, .fg textarea:focus { border-color: var(--bmd); }
    .fg input::placeholder, .fg textarea::placeholder { color: var(--t3); }
    .fg textarea { resize: vertical; min-height: 80px; font-family: var(--mono); font-size: 11px; }
    .row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }

    /* BUTTONS */
    .btn-run { width: 100%; background: var(--t1); color: var(--bg); border: none; border-radius: 8px; font-size: 14px; font-weight: 700; padding: 13px; cursor: pointer; transition: opacity 0.15s, transform 0.15s; margin-top: 4px; }
    .btn-run:hover { opacity: 0.88; transform: translateY(-1px); }
    .btn-run:active { transform: translateY(0); }
    .btn-run:disabled { opacity: 0.35; cursor: not-allowed; transform: none; }
    .btn-stop { width: 100%; background: transparent; color: var(--red); border: 1px solid rgba(248,113,113,0.3); border-radius: 8px; font-size: 13px; font-weight: 600; padding: 11px; cursor: pointer; transition: background 0.15s, border-color 0.15s; margin-top: 10px; display: none; }
    .btn-stop:hover { background: rgba(248,113,113,0.08); border-color: rgba(248,113,113,0.5); }

    /* LOG */
    .log-wrap { grid-column: 1 / -1; }
    .log-box { background: var(--bg); border: 1px solid var(--border); border-radius: 8px; padding: 14px; height: 300px; overflow-y: auto; font-family: var(--mono); font-size: 11.5px; line-height: 1.8; }
    .log-line { display: flex; gap: 10px; }
    .log-time { color: var(--t3); flex-shrink: 0; }
    .log-msg  { color: var(--t2); word-break: break-all; }
    .log-msg.join   { color: var(--green); }
    .log-msg.kick   { color: var(--yellow); }
    .log-msg.error  { color: var(--red); }
    .log-msg.info   { color: var(--t1); }
    .log-msg.leave  { color: var(--t3); }
    .log-actions { display: flex; justify-content: flex-end; margin-bottom: 8px; }
    .log-clear { background: none; border: none; color: var(--t3); font-size: 11px; font-family: var(--mono); cursor: pointer; padding: 2px 8px; border-radius: 4px; transition: color 0.15s; }
    .log-clear:hover { color: var(--t1); }
  </style>
</head>
<body>

<nav class="nav">
  <div class="nav-brand">44<span>Tools</span></div>
  <div class="nav-right">
    <div class="conn-dot" id="connDot"></div>
    <span class="conn-label" id="connLabel">connecting...</span>
  </div>
</nav>

<div class="wrap">

  <!-- STATUS BAR -->
  <div class="status-bar">
    <div class="status-item">
      <div class="status-label">ACTIVE BOTS</div>
      <div class="status-val" id="botCount">0</div>
    </div>
    <div class="status-sep"></div>
    <div class="status-item">
      <div class="status-label">SERVER</div>
      <div class="status-val" id="targetDisplay">—</div>
    </div>
    <div class="status-badge" id="statusBadge">
      <div class="badge-dot"></div>
      <span id="statusText">IDLE</span>
    </div>
  </div>

  <!-- CONFIG -->
  <div class="card">
    <div class="card-title">
      <svg viewBox="0 0 20 20" fill="none"><path d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z" stroke="currentColor" stroke-width="1.5"/><circle cx="10" cy="10" r="3" stroke="currentColor" stroke-width="1.5"/></svg>
      Configuration
    </div>
    <div class="row">
      <div class="fg"><label>SERVER IP</label><input id="bf_host" placeholder="play.example.net" autocomplete="off"/></div>
      <div class="fg"><label>PORT</label><input id="bf_port" type="number" value="25565"/></div>
    </div>
    <div class="row">
      <div class="fg"><label>BOTS (max 50)</label><input id="bf_bots" type="number" value="5" min="1" max="50"/></div>
      <div class="fg"><label>SPAM MESSAGE</label><input id="bf_msg" value="RAIDED BY 44Tools"/></div>
    </div>
    <div class="fg"><label>PROXIES <span style="color:var(--t3);font-weight:400">(ip:port, one per line — optional)</span></label><textarea id="bf_proxies" placeholder="1.2.3.4:1080&#10;5.6.7.8:3128"></textarea></div>
    <button class="btn-run" id="runBtn" onclick="startFlood()">▶ START FLOOD</button>
    <button class="btn-stop" id="stopBtn" onclick="stopFlood()">■ STOP ALL BOTS</button>
  </div>

  <!-- STATS -->
  <div class="card">
    <div class="card-title">
      <svg viewBox="0 0 20 20" fill="none"><path d="M2 10h4v8H2zM8 6h4v12H8zM14 2h4v16h-4z" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/></svg>
      Live Stats
    </div>
    <div style="display:flex;flex-direction:column;gap:14px;margin-top:4px">
      <div style="background:var(--bg-3);border-radius:8px;padding:14px">
        <div style="font-size:10px;color:var(--t3);letter-spacing:0.1em;margin-bottom:6px">BOTS ONLINE</div>
        <div style="font-size:32px;font-weight:700;font-family:var(--mono);color:var(--t1)" id="bigBotCount">0</div>
      </div>
      <div style="background:var(--bg-3);border-radius:8px;padding:14px">
        <div style="font-size:10px;color:var(--t3);letter-spacing:0.1em;margin-bottom:6px">STATE</div>
        <div style="font-size:14px;font-weight:600;font-family:var(--mono);color:var(--t2)" id="bigState">IDLE</div>
      </div>
      <div style="background:var(--bg-3);border-radius:8px;padding:14px">
        <div style="font-size:10px;color:var(--t3);letter-spacing:0.1em;margin-bottom:6px">TARGET</div>
        <div style="font-size:13px;font-weight:600;font-family:var(--mono);color:var(--t2);word-break:break-all" id="bigTarget">—</div>
      </div>
    </div>
  </div>

  <!-- LOG -->
  <div class="card log-wrap">
    <div class="card-title">
      <svg viewBox="0 0 20 20" fill="none"><path d="M4 4h12M4 8h12M4 12h8" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
      Live Log
      <div class="log-actions" style="margin-left:auto;margin-bottom:0">
        <button class="log-clear" onclick="clearLog()">clear</button>
      </div>
    </div>
    <div class="log-box" id="logBox"></div>
  </div>

</div>

<script>
  const proto = location.protocol === 'https:' ? 'wss' : 'ws';
  const ws = new WebSocket(proto + '://' + location.host);
  let running = false;

  ws.onopen = () => {
    document.getElementById('connDot').classList.add('on');
    document.getElementById('connLabel').textContent = 'connected';
  };
  ws.onclose = () => {
    document.getElementById('connDot').classList.remove('on');
    document.getElementById('connLabel').textContent = 'disconnected';
    addLog('error', 'Lost connection to server.');
  };
  ws.onerror = () => addLog('error', 'WebSocket error.');

  ws.onmessage = e => {
    const d = JSON.parse(e.data);
    if (d.type === 'status') {
      running = d.running;
      updateStatus(d.running, d.botCount);
    } else {
      addLog(d.type, d.msg, d.time);
    }
  };

  function addLog(type, msg, time) {
    const box = document.getElementById('logBox');
    const line = document.createElement('div');
    line.className = 'log-line';
    const t = time || new Date().toLocaleTimeString();
    line.innerHTML = '<span class="log-time">' + t + '</span><span class="log-msg ' + type + '">' + escHtml(msg) + '</span>';
    box.appendChild(line);
    box.scrollTop = box.scrollHeight;
    // keep max 200 lines
    while (box.children.length > 200) box.removeChild(box.firstChild);
  }

  function escHtml(s) {
    return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  }

  function clearLog() { document.getElementById('logBox').innerHTML = ''; }

  function updateStatus(isRunning, botCount) {
    document.getElementById('botCount').textContent = botCount;
    document.getElementById('bigBotCount').textContent = botCount;
    const badge = document.getElementById('statusBadge');
    const st    = document.getElementById('statusText');
    const big   = document.getElementById('bigState');
    if (isRunning) {
      badge.classList.add('active');
      st.textContent = 'RUNNING';
      big.textContent = 'RUNNING';
      big.style.color = 'var(--green)';
    } else {
      badge.classList.remove('active');
      st.textContent = 'IDLE';
      big.textContent = 'IDLE';
      big.style.color = 'var(--t2)';
    }
    document.getElementById('runBtn').style.display  = isRunning ? 'none' : 'block';
    document.getElementById('stopBtn').style.display = isRunning ? 'block' : 'none';
  }

  async function startFlood() {
    const host = document.getElementById('bf_host').value.trim();
    const port = document.getElementById('bf_port').value.trim();
    const bots = document.getElementById('bf_bots').value.trim();
    const msg  = document.getElementById('bf_msg').value.trim();
    const prox = document.getElementById('bf_proxies').value.trim();

    if (!host) return addLog('error', 'Enter a server IP.');
    if (!port) return addLog('error', 'Enter a port.');

    document.getElementById('targetDisplay').textContent = host + ':' + port;
    document.getElementById('bigTarget').textContent     = host + ':' + port;

    const res = await fetch('/start', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ host, port: parseInt(port), bots: parseInt(bots), message: msg, proxies: prox })
    });
    const data = await res.json();
    if (!data.ok) addLog('error', data.error || 'Failed to start.');
  }

  async function stopFlood() {
    await fetch('/stop', { method: 'POST' });
  }
</script>
</body>
</html>
